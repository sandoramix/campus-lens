<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>campus-lens</title>
	<link rel="shortcut icon" href="{{ url_for('static', filename='42.jpg') }}">
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
	<link rel="stylesheet" href="{{ url_for('static', filename='fawesome/css/font-awesome.min.css') }}">
	<link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
	<script>
		try {
			const theme = localStorage.getItem('campus-lens.theme');
			if (theme) document.documentElement.dataset.theme = theme;
		} catch (e) { }
	</script>
</head>

<body>
	<header class="appbar">
		<div class="appbar-row">
			<a class="brand" href="{{ url_for('Homepage') }}" title="Reset everything">
				<img src="{{ url_for('static', filename='42.jpg') }}" alt="">
				<span>campus<b>lens</b></span>
			</a>

			<div class="campus-picker">
				<div class="campus-select" id="campus-select"></div>
				<button class="btn icon-btn" id="btn-campuses" title="Fetch &amp; update campuses (C)"><i class="fa fa-cloud-download"></i></button>
			</div>

			<label class="search">
				<i class="fa fa-search" aria-hidden="true"></i>
				<input id="quick-search" type="search" placeholder="Search login, name or email…" autocomplete="off" spellcheck="false">
				<kbd>/</kbd>
			</label>

			<div class="appbar-actions">
				<button class="btn btn-ghost icon-btn" id="btn-shortcuts" title="Keyboard shortcuts (?)"><i class="fa fa-keyboard-o"></i></button>
				<button class="btn btn-ghost icon-btn" id="btn-theme" title="Toggle theme"><i class="fa fa-adjust"></i></button>
				<button class="btn btn-primary" id="btn-filters" title="Filters (F)">
					<i class="fa fa-sliders"></i><span>Filters</span><span class="count-badge" id="filter-count" hidden></span>
				</button>
			</div>
		</div>

		<nav class="tabs" id="view-tabs" role="tablist">
			<button role="tab" data-view="students"><i class="fa fa-users"></i>Students <span class="tab-count" data-count="students"></span></button>
			<button role="tab" data-view="exams"><i class="fa fa-graduation-cap"></i>Exams <span class="tab-count" data-count="exams"></span></button>
			<button role="tab" data-view="projects"><i class="fa fa-folder-open-o"></i>Projects <span class="tab-count" data-count="projects"></span></button>
		</nav>
	</header>

	<div class="chipbar" id="chipbar" hidden></div>

	<main class="scroller" id="scroller">
		<div class="page" id="page">
			<div id="notices"></div>
			<div id="view"></div>
		</div>
	</main>

	<div class="loading" id="loading" hidden>
		<div class="loading-card">
			<div class="spinner"></div>
			<div class="loading-text">
				<div class="loading-title" id="loading-title">Loading students…</div>
				<div class="loading-sub" id="loading-sub"></div>
				<span class="progress" id="loading-progress" hidden><i></i></span>
			</div>
		</div>
	</div>

	<div class="scrim" id="scrim" hidden></div>
	<aside class="sheet sheet-filters" id="filter-panel" aria-label="Filters" hidden></aside>
	<aside class="sheet sheet-student" id="student-drawer" aria-label="Student" hidden></aside>

	<div class="popover" id="popover" hidden></div>
	<div class="toasts" id="toasts"></div>
	<div class="modal" id="shortcuts" hidden></div>
	<div class="modal" id="campus-manager" hidden></div>
	<div class="modal" id="export-modal" hidden></div>
	<div class="lightbox" id="lightbox" role="dialog" aria-label="Photo" hidden></div>

	<script src="{{ url_for('static', filename='app.js') }}"></script>
</body>

</html>
